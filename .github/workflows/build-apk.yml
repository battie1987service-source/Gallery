name: Build APK

on:
  push:
    branches: [feature/**]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build foss debug APK
        run: ./gradlew :app:assembleFossDebug

      - name: Show signing certificate
        run: |
          apksigner=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/foss/debug/*.apk; do
            digest=$($apksigner verify --print-certs "$apk" | grep -m1 "SHA-256 digest")
            echo "::notice title=$(basename "$apk")::$digest"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: gallery-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
